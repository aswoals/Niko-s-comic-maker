# ============================================================
#  duosplit_settings.yaml — LoRA 없는 두 명 컷 '나눠 그리기'(nk_duosplit.py) 설정
#  코드를 몰라도 이 파일의 숫자만 고치면 됨. 저장하면 다음에 그리는 컷부터 바로 적용 (작업실을 다시 켤 필요 없음).
#  이미 그린 컷은 안 바뀜 (바꾸려면 그 컷의 '다시 그리기').
#  파일이 없거나 값이 틀리면 화면에 [WARN] 을 내고 아래 '처음 값'으로 그림.
#  LoRA 캐릭터가 나오는 두 명 컷(nk_regionlora.py)에는 적용되지 않음.
# ============================================================

# 두 명 컷을 나눠 그리나?
#   true  = 기준 그림 -> SAM3 로 두 사람 자리 찾기 -> 사람마다 자기 구역에서 자기 글로만 다시 그림 (두 사람 옷·생김새가 덜 섞임)
#   false = 예전처럼 한 번에 그림 (컷당 시간이 짧음)
#   만화 하나만 끄려면 이 줄 대신 계획표(plan.yaml)나 콘티(conti.yaml)에 duo_split: off
#   ComfyUI 에 Impact Pack 이 없으면 true 여도 경고 한 줄을 내고 한 번에 그림.
#   처음 값: true
enabled: true

# 둘 중 한 사람의 구역이 그림의 이 비율보다 작으면 나누기를 포기하고 기준 그림(한 번에 그린 그림)을 최종으로 씀.
#   왜 0.08: 시험에서 구역이 유난히 작게 잡힌 컷은 3.5~6.3%, 멀쩡한 컷 중 가장 작은 구역은 10.3% 였음. 8% 는 그 사이.
#   아주 작은 구역도 나누려면 0.005 (0.5%). 0 ~ 0.5 사이.  처음 값: 0.08
min_region: 0.08

# 전체 걸음 수. 시험한 값은 25 (늘리면 더 느림). 4 ~ 100 사이 정수.  처음 값: 25
steps: 25

# 처음 몇 걸음을 전체 글(구도·누가 무엇을 하나)로 그리나. 나머지 걸음은 사람마다 자기 구역 글로만 그림.
#   크게 = 기준 그림 구도를 더 따름 / 작게 = 사람마다 더 따로 그림 (구도가 바뀔 수 있음).
#   1 ~ (steps - 1) 사이 정수. 예전 시험 값 6.  처음 값: 12
base_only: 12

# 글을 얼마나 따르나 (CFG). 1 ~ 15.  처음 값: 5.0
cfg: 5.0

# 구역 경계를 얼마나 부드럽게 잇나 (Impact Pack overlap_factor). 이음새가 보이면 16 ~ 24. 0 ~ 64.  처음 값: 10
overlap: 10
