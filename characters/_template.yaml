# ============================================================
#  캐릭터 파일 양식 — 이 파일을 복사해서 characters/<영어이름>.yaml 로 저장하고 내용을 바꾼다.
#  (이름이 _ 로 시작하는 파일은 프로그램이 캐릭터 목록에 넣지 않는다.)
#  자세한 안내: docs/ADDING.md
#  ※ 전연령 전용: 성인·선정적 묘사, 실존 인물, 남의 저작권 캐릭터를 허락 없이 쓰지 않는다 (USE_POLICY.md).
# ============================================================
ai_hide: true                 # 이 줄은 양식 전용. 진짜 캐릭터 파일에서는 지운다.

# ---------- 기본 (꼭 채우기) ----------
name: mychar                    # 파일 이름과 같게 (영어 소문자)
trigger: mychar                 # NoobAI 흐름의 첫 태그 (LoRA 트리거 단어, LoRA 가 없으면 캐릭터 태그나 이름)
name_ko: 내 캐릭터               # 한국어 이름 (글콘티용 첨부 파일·작업실에 나옴)
personality: 밝고 장난스러움. 짧은 반말.   # 성격·말투 한 줄 (대사가 이 말투로 써짐)

# 외형 태그 (Danbooru/e621 태그, 쉼표로). short = 트리거+핵심, full = 외형 전부
tags_short: "1boy, furry, anthro, fox boy, orange fur, white muzzle, green eyes"
tags_full: "1boy, furry, anthro, fox boy, orange fur, white muzzle, white chest, green eyes, pointy ears, fluffy tail, blue hoodie, shorts"
negative_extra: "human ears"     # 이 캐릭터일 때만 더하는 부정 태그 (색 낱말·furry·anthro 는 넣지 않기)

# ---------- Anima 흐름 (기본 그리기) — 짧은 영어 문장 ----------
anima: "A small anthro fox boy with orange fur, a white muzzle, green eyes, pointy ears, a fluffy tail and a blue hoodie."
# 아래는 선택 (없으면 anima 를 씀)
# anima_upper: "upper body of ..."      # 허리 위 컷
# anima_head: "head of ..."             # 얼굴·눈 컷 (얼굴 묘사)
# anima_face: "close-up of ... face"    # 얼굴 다듬기
# anima_face_neg: "human face"
# anima_chest: "chest of ..."           # 가슴만 다시 그리기
# anima_back: "seen from behind, ..."   # 뒷모습 컷
# anima_eyes / anima_hands              # 눈만·손만 극근접 컷
# anima_body: "body of ..., no head"     # 얼굴이 칸 밖인 컷(head out of frame)에서 머리 묘사 없이 쓰는 몸 설명 (없으면 anima 에서 머리 낱말을 뺌)

# ---------- LoRA 캐릭터 (선택) — 직접 학습한 LoRA 가 있을 때 ----------
# lora: mychar_v1.safetensors           # NoobAI 흐름 LoRA (ComfyUI models/loras)
# lora_strength: 1.0
# anima_lora: mychar_anima_v1.safetensors   # Anima 흐름 LoRA. 있으면 두 명 컷에서 이 캐릭터 자리에만 LoRA 를 건다
# anima_lora_strength: 1.0
# anima_lora_desc: "a small anthro fox boy, ..."   # LoRA 로 그릴 때의 짧은 설명
# anima_face_pass: true                 # LoRA 캐릭터 얼굴만 한 번 더 다듬기 (false = 끔)
# anima_region_head: "1boy, furry, anthro"   # 두 명 컷 영역 글 머리말 (없으면 태그에서 1boy/1girl·furry 를 자동으로)

# ---------- 자리 찾기 (SAM3) — 짧은 명사가 잘 먹힘 ----------
# anima_find: orange fox                # 이 캐릭터 몸을 찾을 말 (없으면 sam_body > sam_find > 태그의 동물 종 > furry > character)
# sam_find: fox boy in a blue hoodie    # 두 명 컷에서 상대로 찾을 때
compose_name: orange fox boy            # 두 명 합치기·편집 문장에서 부르는 겉모습 이름 (이름 대신 겉모습)
# duo_exclusive: "blue hoodie"          # 두 명 컷에서 상대에게 옮겨 붙으면 안 되는 이 캐릭터만의 것
# mask_grow: 1.3                        # 두 명 컷 영역을 키움 (옷 부피가 큰 캐릭터)
# mask_cap: 1.2
# height_cm: 140                        # 두 명 컷 키 차이 (3D 인형)

# ---------- 고치기 단계 (선택) ----------
# facefix: {tags: "...", neg: "...", drop: "...", good: {facial_mark: 0.6}, bad: "...", bad_max: 0.3}
# back_ref: character/mychar_back.png   # 뒷모습 무늬 고치기에 쓰는 시트 그림 (키트 폴더 기준 경로)
# back_name: the fox boy
# back_kind: fox
# back_desc: "plain orange fur on the back, a fluffy tail"
# hands: {tags: "orange fur, paw pads", desc: "fox paw hand", expect: bright}   # 손 색 검사 (expect: dark / bright)
# forbid: "extra tail"                  # 판별기에 걸리면 안 되는 태그

# ---------- 글콘티용 첨부 파일 ----------
# ai_note: "LoRA 로 그림"             # 캐릭터 목록에 붙는 메모

# ---------- 자동 검수 (nk qa, 로컬 VLM) — '무슨 값인가?'로 묻기 (docs/conti_rules.md 4절) ----------
qa_desc: "an orange fox boy in a blue hoodie"
qa_checklist:
  - id: hoodie
    must: true
    q: "What is the character wearing on the upper body?"
    options: ["a blue hoodie", "something else", "not visible"]
    expect: ["a blue hoodie", "not visible"]
  - id: text
    must: true
    q: "Is there any text in the picture?"
    options: ["no text at all", "there is text or a signature or watermark"]
    expect: ["no text"]
