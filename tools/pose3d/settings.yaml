# tools/pose3d 설정 (시제품)
# 코드를 몰라도 이 파일만 고치면 인형 체형·카메라 기본값이 바뀜. 단위: 캐릭터 키(귀 뺀 키) = 1.0
# 에러가 나면: 들여쓰기(스페이스 2칸)와 콜론(:) 뒤 한 칸을 확인. 모르겠으면 이 파일을 git에서 되돌리면 기본값으로 돌아감.

# 체형 (머리 큰 케모노 체형을 눈대중으로 잡은 기본값. 내 캐릭터 시트 비율에 맞게 고쳐 쓰면 됨)
body:
  head_rx: 0.125        # 머리 반지름 (가로)  시트: 머리 폭 약 0.25
  head_ry: 0.115        # 머리 반지름 (세로)  시트: 머리 높이 약 0.23 (귀 제외)
  head_rz: 0.115        # 머리 반지름 (앞뒤, 추정)
  neck: 0.06            # 목 길이
  torso: 0.30           # 골반(엉덩이 관절 높이) ~ 목 밑
  torso_rx: 0.10        # 몸통 반지름 가로
  torso_rz: 0.085       # 몸통 반지름 앞뒤 (추정)
  shoulder_w: 0.10      # 어깨 반폭
  shoulder_drop: 0.03   # 목 밑에서 어깨까지 내려오는 정도
  upper_arm: 0.14
  forearm: 0.13
  arm_r: 0.035          # 팔 굵기 (반지름)
  paw_r: 0.05           # 손(발바닥 모양 손) 반지름 — 시트는 손이 큼
  hip_w: 0.07           # 엉덩이 관절 반폭
  thigh: 0.17
  shin: 0.16
  thigh_r: 0.06         # 허벅지 굵기
  shin_r: 0.045
  foot: 0.08            # 발 길이
  foot_r: 0.035
  ear_len: 0.10         # 고양이 귀 길이 (깊이·틀에만 쓰임, OpenPose 귀 점은 사람처럼 머리 옆)
  ear_r: 0.045          # 고양이 귀 뿌리 반폭
  muzzle: 0.035         # 주둥이 크기 (얼굴 방향이 깊이 그림에 보이게)
  tail_seg: 0.11        # 꼬리 마디 길이 (4마디)
  tail_r: 0.045

# 사람마다 키 배율 (a = 첫 사람, b = 상대). 콘티 cast 순서가 아니라 자세 틀 안의 역할: 업기는 a가 업는 쪽
people:
  a: {scale: 1.0}
  b: {scale: 1.0}

# 카메라 기본값 (yaw: 0 = 정면, 90 = 오른쪽 옆에서 / pitch: 0 = 눈높이, 60 = 위에서 내려다봄 / dist: 비우면 자동으로 두 사람이 다 들어오게)
camera:
  yaw: 20
  pitch: 8
  dist: null
  fov: 35               # 세로 화각(도). 작을수록 망원(원근 약함)
  margin: 1.12          # 자동 거리일 때 여백 배율

# 출력
image:
  width: 512
  height: 640
  depth_far: 40         # 깊이 그림에서 가장 먼 몸 부분의 밝기 (0~255, 배경은 0)
  line_px: 2            # 선화 굵기
  person_colors:        # 사람별 틀 색 (a, b)
    - [255, 80, 80]
    - [80, 140, 255]
