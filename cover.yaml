# ============================================================
#  cover.yaml — 만화 표지 설정 (페이지형 만화 맨 앞에 표지 한 장)
#  표지 = 제목 + 주인공 그림 + 'AI로 제작' 문구 + 작가 줄. 말풍선 조립(letter)이 끝날 때 자동으로 맨 앞에 들어감
#  결과: episodes/<만화>/out/page_00.png (+ book.pdf 맨 앞 쪽), 표지만 따로 episodes/<만화>/cover/cover.png
#  고친 뒤에는 nk ep cover <만화> (표지만 다시) 또는 말풍선 다시 하기를 하면 반영됨
#  만화마다 다르게 하려면 episodes/<만화>/cover.yaml 에 바꿀 칸만 적음 (그 값이 우선)
#  에러가 나면: 표지 그림을 못 그려도 만화는 그대로 끝남 (그림 없이 색 바탕 + 글자 표지). 이유는 episodes/<만화>/cover/draw.log
# ============================================================
enabled: true                 # false 로 바꾸면 표지를 안 넣음

# ---- 글자 ----
title: ""                     # 비우면 계획표(plan)의 title. 끝의 (…) 설명은 자동으로 빼고, '—' 앞은 큰 글씨, 뒤는 작은 글씨
                              # 직접 정하려면 예: title: "숲속 모험 — 첫째 날"
author: ""                    # 비우면 작가 줄 없음. 예: author: "작가 - 이름"
ai_notice: "이 만화는 AI로 제작되었습니다"   # AI로 만든 그림임을 알리는 문구 (공개할 때는 켜 두는 것을 권함). 빼려면 ""

# ---- 표지 그림 ----
art: draw                     # draw = 표지 그림을 새로 그림 (처음 한 번만, 몇 분) / none = 그림 없이 색 바탕 / cut:12 = 만화의 12번 컷 그림을 그대로 씀
                              # 내 그림을 쓰려면 episodes/<만화>/cover/art.png 로 저장 (직접 넣은 그림은 절대 덮어쓰지 않음)
variant: 0                    # 그림이 마음에 안 들면 1, 2, 3 … 으로 바꾸고 nk ep cover <만화> = 다른 그림 (옛 그림은 cover/_old 에 남음)
chars: []                     # 표지에 그릴 캐릭터 (계획표 cast 의 키, 최대 2). 비우면 주인공·가장 많이 나오는 한두 명. 예: chars: [hero, buddy]
place: ""                     # 배경 태그 (비우면 만화의 첫 장소). 예: place: "park, blue sky, outdoors, day"
shot: knee                    # knee(무릎 위) / full(전신) / waist(허리 위)
action: ""                    # 동작 태그 (비우면 서서 정면을 보고 웃기). 표지도 전연령 그림만 그림
sentence: ""                  # 동작 영어 문장 (비우면 기본 문장)

# ---- 모양 ----
title_color: "#FFFFFF"
stroke_color: "#14141E"
shade: 0.8                    # 위·아래 어두운 띠 진하기 (0 = 없음 ~ 1)
font: ""                      # 비우면 presets.yaml 의 manga.font (없으면 fonts/ 의 글꼴)

# ---- 그리기 한도 ----
comfy_wait: 60                # 표지 그릴 때 ComfyUI 를 기다리는 최대 초 (꺼져 있으면 이만큼 기다리다 글자만 표지)
timeout_min: 40               # 표지 그리기 최대 시간 (분)
